<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>에어 컴뱃 - 비행기 슈팅 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Pretendard', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .touch-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: auto;
            display: none; /* 기본적으로 숨김, 터치 감지 시 표시 */
        }
        @media (pointer: coarse) {
            .touch-controls { display: flex; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- 점수 및 생명력 -->
        <div class="p-4 text-white flex justify-between items-start">
            <div>
                <div class="text-2xl font-bold italic tracking-wider">SCORE: <span id="scoreDisplay">0</span></div>
                <div class="text-sm opacity-70">BEST: <span id="bestScore">0</span></div>
            </div>
            <div class="flex gap-2" id="healthBar">
                <!-- 하트 아이콘이 여기에 추가됩니다 -->
            </div>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="gameOverScreen" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-white pointer-events-auto">
            <h2 class="text-5xl font-black mb-4 text-red-500">MISSION FAILED</h2>
            <p class="text-xl mb-8">최종 점수: <span id="finalScore">0</span></p>
            <button onclick="resetGame()" class="bg-white text-black px-8 py-3 rounded-full font-bold hover:bg-gray-200 transition-transform active:scale-95">
                다시 시작
            </button>
        </div>
    </div>

    <!-- 모바일 컨트롤 -->
    <div class="touch-controls">
        <div id="joystickZone" class="w-32 h-32 bg-white/10 rounded-full relative border border-white/20">
            <div id="joystickKnob" class="w-12 h-12 bg-white/30 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
        </div>
        <button id="fireButton" class="w-24 h-24 bg-red-600/50 rounded-full border-4 border-red-500 flex items-center justify-center active:bg-red-500">
            <span class="font-bold text-white">FIRE</span>
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestScoreDisplay = document.getElementById('bestScore');
        const finalScoreDisplay = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const healthBar = document.getElementById('healthBar');

        // 게임 상태
        let score = 0;
        let bestScore = localStorage.getItem('airplane_best_score') || 0;
        let isGameOver = false;
        let animationId;
        let frameCount = 0;

        // 플레이어 설정
        const player = {
            x: 0,
            y: 0,
            width: 50,
            height: 50,
            speed: 6,
            health: 3,
            bullets: [],
            lastFired: 0,
            fireRate: 200 // ms
        };

        let enemies = [];
        let particles = [];
        let keys = {};

        // 초기화
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 100;
            bestScoreDisplay.innerText = bestScore;
            updateHealthUI();
        }

        function updateHealthUI() {
            healthBar.innerHTML = '';
            for(let i=0; i<3; i++) {
                const heart = document.createElement('span');
                heart.innerHTML = i < player.health ? '❤️' : '🖤';
                healthBar.appendChild(heart);
            }
        }

        // 입력 처리
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // 파티클 생성 (폭발 효과)
        function createExplosion(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 3,
                    alpha: 1,
                    color: color || '#ff5500'
                });
            }
        }

        // 비행기 그리기 (도형으로)
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y + player.height/2);
            
            // 몸체
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.moveTo(0, -25); // 코
            ctx.lineTo(20, 20); // 우측 날개 끝
            ctx.lineTo(0, 10);  // 중앙 하단
            ctx.lineTo(-20, 20); // 좌측 날개 끝
            ctx.closePath();
            ctx.fill();

            // 캐노피
            ctx.fillStyle = '#93c5fd';
            ctx.beginPath();
            ctx.arc(0, -5, 6, 0, Math.PI * 2);
            ctx.fill();

            // 부스터 불꽃
            if (frameCount % 4 < 2) {
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.moveTo(-5, 15);
                ctx.lineTo(0, 30);
                ctx.lineTo(5, 15);
                ctx.fill();
            }

            ctx.restore();
        }

        function spawnEnemy() {
            if (frameCount % 60 === 0) {
                enemies.push({
                    x: Math.random() * (canvas.width - 40),
                    y: -50,
                    width: 40,
                    height: 40,
                    speed: 2 + Math.random() * 3,
                    color: `hsl(${Math.random() * 40 + 0}, 80%, 50%)`
                });
            }
        }

        function update() {
            if (isGameOver) return;

            frameCount++;

            // 플레이어 이동
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

            // 화면 밖으로 못 나가게 제한
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // 총알 발사
            if (keys['Space']) {
                const now = Date.now();
                if (now - player.lastFired > player.fireRate) {
                    player.bullets.push({
                        x: player.x + player.width/2 - 3,
                        y: player.y,
                        width: 6,
                        height: 15,
                        speed: 10
                    });
                    player.lastFired = now;
                }
            }

            // 총알 업데이트
            player.bullets.forEach((b, i) => {
                b.y -= b.speed;
                if (b.y < -20) player.bullets.splice(i, 1);
            });

            // 적 업데이트
            enemies.forEach((en, i) => {
                en.y += en.speed;
                
                // 플레이어와 충돌
                if (en.x < player.x + player.width &&
                    en.x + en.width > player.x &&
                    en.y < player.y + player.height &&
                    en.y + en.height > player.y) {
                    enemies.splice(i, 1);
                    player.health--;
                    updateHealthUI();
                    createExplosion(player.x + player.width/2, player.y + player.height/2, '#ff0000');
                    if (player.health <= 0) endGame();
                }

                // 총알과 충돌
                player.bullets.forEach((b, bi) => {
                    if (b.x < en.x + en.width &&
                        b.x + b.width > en.x &&
                        b.y < en.y + en.height &&
                        b.y + b.height > en.y) {
                        createExplosion(en.x + en.width/2, en.y + en.height/2, en.color);
                        enemies.splice(i, 1);
                        player.bullets.splice(bi, 1);
                        score += 100;
                        scoreDisplay.innerText = score;
                    }
                });

                if (en.y > canvas.height) enemies.splice(i, 1);
            });

            // 파티클 업데이트
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                if (p.alpha <= 0) particles.splice(i, 1);
            });

            spawnEnemy();
        }

        function draw() {
            ctx.fillStyle = '#0f172a'; // 짙은 네이비 배경
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 별 배경
            ctx.fillStyle = 'white';
            for(let i=0; i<50; i++) {
                let x = (Math.sin(i) * 10000 + frameCount * (i%3+1)) % canvas.width;
                let y = (Math.cos(i) * 10000) % canvas.height;
                ctx.globalAlpha = 0.5;
                ctx.fillRect(x, y, 2, 2);
                ctx.globalAlpha = 1;
            }

            player.bullets.forEach(b => {
                ctx.fillStyle = '#60a5fa';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#60a5fa';
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.shadowBlur = 0;
            });

            enemies.forEach(en => {
                ctx.fillStyle = en.color;
                ctx.beginPath();
                ctx.moveTo(en.x + en.width/2, en.y + en.height);
                ctx.lineTo(en.x, en.y);
                ctx.lineTo(en.x + en.width, en.y);
                ctx.closePath();
                ctx.fill();
            });

            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            drawPlayer();
        }

        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('airplane_best_score', bestScore);
            }
            finalScoreDisplay.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            scoreDisplay.innerText = score;
            player.health = 3;
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 100;
            enemies = [];
            player.bullets = [];
            particles = [];
            isGameOver = false;
            gameOverScreen.classList.add('hidden');
            updateHealthUI();
            gameLoop();
        }

        // 터치 조이스틱 로직
        const knob = document.getElementById('joystickKnob');
        const zone = document.getElementById('joystickZone');
        let stickActive = false;

        zone.addEventListener('touchstart', (e) => {
            stickActive = true;
            handleJoystick(e);
        });

        window.addEventListener('touchmove', (e) => {
            if (stickActive) handleJoystick(e);
        });

        window.addEventListener('touchend', () => {
            stickActive = false;
            knob.style.left = '50%';
            knob.style.top = '50%';
            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;
            keys['ArrowUp'] = false;
            keys['ArrowDown'] = false;
        });

        function handleJoystick(e) {
            const touch = e.touches[0];
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            
            const distance = Math.min(rect.width / 2, Math.sqrt(dx*dx + dy*dy));
            const angle = Math.atan2(dy, dx);
            
            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;
            
            knob.style.left = `calc(50% + ${moveX}px)`;
            knob.style.top = `calc(50% + ${moveY}px)`;

            // 조작 감도 설정
            keys['ArrowLeft'] = dx < -15;
            keys['ArrowRight'] = dx > 15;
            keys['ArrowUp'] = dy < -15;
            keys['ArrowDown'] = dy > 15;
        }

        document.getElementById('fireButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['Space'] = true;
        });
        document.getElementById('fireButton').addEventListener('touchend', () => {
            keys['Space'] = false;
        });

        window.addEventListener('resize', init);
        
        window.onload = () => {
            init();
            gameLoop();
        };
    </script>
</body>
</html>
